name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate firebase-config.js from secrets
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:        ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          # Use jq to safely JSON-encode each secret value, avoiding any
          # risk from special characters (quotes, dollar signs, etc.).
          jq -cn \
            --arg apiKey            "$FIREBASE_API_KEY" \
            --arg authDomain        "$FIREBASE_AUTH_DOMAIN" \
            --arg databaseURL       "$FIREBASE_DATABASE_URL" \
            --arg projectId         "$FIREBASE_PROJECT_ID" \
            --arg storageBucket     "$FIREBASE_STORAGE_BUCKET" \
            --arg messagingSenderId "$FIREBASE_MESSAGING_SENDER_ID" \
            --arg appId             "$FIREBASE_APP_ID" \
            '{apiKey:$apiKey,authDomain:$authDomain,databaseURL:$databaseURL,projectId:$projectId,storageBucket:$storageBucket,messagingSenderId:$messagingSenderId,appId:$appId}' \
            | sed 's/^/const firebaseConfig = /; s/$/;/' \
            > firebase-config.js

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html firebase-config.js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
